# gqlgen config for the supergraph core.
# The schema is GLOBBED across the core base plus every plugin's own schema dir:
# a plugin contributes GraphQL fields via `extend type Query`/`Subscription` in
# plugins/<name>/schema/*.graphqls with NO edit under core/ (D2, the S5 seam).
schema:
  - core/graph/schema/*.graphqls
  - plugins/*/schema/*.graphqls

# Exec + resolvers share one package `graph` (outside core/). follow-schema writes
# one <schemafile>.resolvers.go per schema source and PRESERVES existing method
# bodies on regen — that preservation is what makes the zero-core-edit seam work.
exec:
  filename: graph/generated.go
  package: graph

model:
  filename: graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: graph
  package: graph
  filename_template: "{name}.resolvers.go"

# Value (not pointer) returns so resolver signatures line up with the injected
# funcs on Resolver (which deal in core value types), no bridging needed.
omit_slice_element_pointers: true
resolvers_always_return_pointers: false

# Bind GraphQL types straight onto core's Go types so there is no duplicate struct
# and no translation layer between the health snapshot and the API.
models:
  Time:
    model: github.com/99designs/gqlgen/graphql.Time
  Health:
    model: github.com/drewdrewthis/supergraph/core.HealthStatus
  HealthState:
    model: github.com/drewdrewthis/supergraph/core.HealthState
  # Bind the typed github reads onto hand-written structs (D4, mirrors Health): the
  # scalar fields live on the struct so gqlgen emits no resolver for them, while the
  # absent tmuxPanes/claudeSessions fields get field-resolver stubs implemented in
  # graph/ (the cross-plugin join, D2/D3).
  Issue:
    model: github.com/drewdrewthis/supergraph/plugins/github.IssueNode
  PullRequest:
    model: github.com/drewdrewthis/supergraph/plugins/github.PRNode
  Assignee:
    model: github.com/drewdrewthis/supergraph/plugins/github.Assignee
